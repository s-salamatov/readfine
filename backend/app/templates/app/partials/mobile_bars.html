{#- The phone bars and the sidebar backdrop of the reader, included by app/main.html
    (moved out of it in s3-T3). Their CSS is in base.html. -#}
<!-- Mobile bottom bar (hideable-up mode, small bucket only) -->
<div id="mobile-bottom-bar">
  <button id="mobile-bottombar-open-btn" class="shrink-0 w-7 h-7 flex items-center justify-center rounded-sm text-gray-500 hover:bg-gray-100" aria-label="Open feeds">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>
  {% if chat_available %}
  <button id="mobile-bottom-chat-btn" type="button"
          class="shrink-0 w-7 h-7 flex items-center justify-center rounded-sm text-gray-500 hover:bg-gray-100"
          aria-label="AI Chat">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
    </svg>
  </button>
  {% endif %}
  <div class="flex-1"></div>
  <button id="mobile-bottom-refresh-btn" type="button"
          class="shrink-0 w-7 h-7 flex items-center justify-center rounded-sm text-gray-500 hover:bg-gray-100" aria-label="Refresh">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
    </svg>
  </button>
  <button id="mobile-bottom-quicklink" type="button"
          class="shrink-0 text-xs leading-none text-blue-500 hover:text-blue-700 bg-transparent border-0 p-0 cursor-pointer whitespace-nowrap">{{ 'Labels' if has_labeled else 'All' }} →</button>
</div>

<!-- Mobile title bar (hideable mode, small bucket only) -->
<div id="mobile-title-bar">
  <button id="mobile-titlebar-open-btn" class="shrink-0 w-7 h-7 flex items-center justify-center rounded-sm text-gray-500 hover:bg-gray-100" aria-label="Open feeds">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>
  <div class="flex-1 flex items-center gap-1.5 min-w-0">
    <span id="mobile-title-text" class="truncate text-sm font-medium text-gray-700"></span>
    <span id="mobile-title-count" class="hidden"></span>
    {#- Only in a saved search, whose header the bar replaces (_syncMobileTitleForView). -#}
    <button id="mobile-title-edit" type="button" data-action="open-search-again"
            class="hidden shrink-0 ml-1 text-xs leading-none text-blue-500 hover:text-blue-700 bg-transparent border-0 p-0 cursor-pointer"
            title="Change the search, rename or delete it">Edit</button>
  </div>
  <button id="mobile-title-quicklink" type="button" data-alt="{{ 'labels' if has_labeled else 'all' }}"
          class="shrink-0 text-xs leading-none text-blue-500 hover:text-blue-700 bg-transparent border-0 p-0 cursor-pointer whitespace-nowrap">{{ 'Labels' if has_labeled else 'All' }} →</button>
</div>

<!-- Mobile sidebar backdrop -->
<div id="mobile-sidebar-backdrop"></div>
