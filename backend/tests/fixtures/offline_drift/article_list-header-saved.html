<div class="bg-background border-b border-border rf-list-header sticky text-sm top-0 z-10" data-list-header>
  <div class="flex gap-2 items-center px-4 py-2.5">
    <div class="flex flex-1 gap-2 items-baseline min-w-0 rf-list-heading">
      <h1 class="font-semibold min-w-0 text-foreground text-sm truncate" data-list-title>
        Saved
      </h1>
    </div>
    <div class="dropdown-menu" id="list-view-menu">
      <button aria-controls="list-view-menu-menu" aria-expanded="false" aria-haspopup="menu" class="btn" data-size="xs" data-variant="ghost" id="list-view-menu-trigger" title="View options" type="button">
        <svg aria-hidden="true" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 5H3">
          </path>
          <path d="M12 19H3">
          </path>
          <path d="M14 3v4">
          </path>
          <path d="M16 17v4">
          </path>
          <path d="M21 12h-9">
          </path>
          <path d="M21 19h-5">
          </path>
          <path d="M21 5h-7">
          </path>
          <path d="M8 10v4">
          </path>
          <path d="M8 12H3">
          </path>
        </svg>
        View
      </button>
      <div aria-hidden="true" data-align="end" data-popover data-side="bottom" id="list-view-menu-popover">
        <div aria-labelledby="list-view-menu-trigger" id="list-view-menu-menu" role="menu">
          <div aria-labelledby="list-view-menu-density" role="group">
            <div id="list-view-menu-density" role="heading">
              Density
            </div>
            <button aria-checked="false" data-rf-online-only data-rf-view="density:compact" hx-post="/htmx/list-view" hx-swap="none" hx-vals="{&quot;field&quot;: &quot;density&quot;, &quot;value&quot;: &quot;compact&quot;}" role="menuitemradio" type="button">
              Compact
              <span aria-hidden="true" data-indicator>
                <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 6 9 17l-5-5">
                  </path>
                </svg>
              </span>
            </button>
            <button aria-checked="false" data-rf-online-only data-rf-view="density:comfortable" hx-post="/htmx/list-view" hx-swap="none" hx-vals="{&quot;field&quot;: &quot;density&quot;, &quot;value&quot;: &quot;comfortable&quot;}" role="menuitemradio" type="button">
              Comfortable
              <span aria-hidden="true" data-indicator>
                <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 6 9 17l-5-5">
                  </path>
                </svg>
              </span>
            </button>
            <button aria-checked="false" data-rf-online-only data-rf-view="density:summary" hx-post="/htmx/list-view" hx-swap="none" hx-vals="{&quot;field&quot;: &quot;density&quot;, &quot;value&quot;: &quot;summary&quot;}" role="menuitemradio" type="button">
              Summary
              <span aria-hidden="true" data-indicator>
                <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 6 9 17l-5-5">
                  </path>
                </svg>
              </span>
            </button>
          </div>
          <hr role="separator">
          <div aria-labelledby="list-view-menu-sort" role="group">
            <div id="list-view-menu-sort" role="heading">
              Sort
            </div>
            <button aria-checked="false" data-rf-online-only data-rf-view="sort:newest" hx-post="/htmx/list-view" hx-swap="none" hx-vals="{&quot;field&quot;: &quot;sort&quot;, &quot;value&quot;: &quot;newest&quot;}" role="menuitemradio" type="button">
              Newest
              <span aria-hidden="true" data-indicator>
                <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 6 9 17l-5-5">
                  </path>
                </svg>
              </span>
            </button>
            <button aria-checked="false" data-rf-online-only data-rf-view="sort:oldest" hx-post="/htmx/list-view" hx-swap="none" hx-vals="{&quot;field&quot;: &quot;sort&quot;, &quot;value&quot;: &quot;oldest&quot;}" role="menuitemradio" type="button">
              Oldest
              <span aria-hidden="true" data-indicator>
                <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 6 9 17l-5-5">
                  </path>
                </svg>
              </span>
            </button>
          </div>
          <hr role="separator">
          <div aria-labelledby="list-view-menu-unread" role="group">
            <div id="list-view-menu-unread" role="heading">
              Show
            </div>
            <button aria-checked="false" data-rf-online-only data-rf-view="unread:unread_only" hx-post="/htmx/list-view" hx-swap="none" hx-vals="{&quot;field&quot;: &quot;unread&quot;, &quot;value&quot;: &quot;unread_only&quot;}" role="menuitemradio" type="button">
              Unread only
              <span aria-hidden="true" data-indicator>
                <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 6 9 17l-5-5">
                  </path>
                </svg>
              </span>
            </button>
            <button aria-checked="false" data-rf-online-only data-rf-view="unread:show_all" hx-post="/htmx/list-view" hx-swap="none" hx-vals="{&quot;field&quot;: &quot;unread&quot;, &quot;value&quot;: &quot;show_all&quot;}" role="menuitemradio" type="button">
              All
              <span aria-hidden="true" data-indicator>
                <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 6 9 17l-5-5">
                  </path>
                </svg>
              </span>
            </button>
            <button aria-checked="false" data-rf-online-only data-rf-view="unread:adaptive" hx-post="/htmx/list-view" hx-swap="none" hx-vals="{&quot;field&quot;: &quot;unread&quot;, &quot;value&quot;: &quot;adaptive&quot;}" role="menuitemradio" type="button">
              Adaptive
              <span aria-hidden="true" data-indicator>
                <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 6 9 17l-5-5">
                  </path>
                </svg>
              </span>
            </button>
          </div>
          <hr role="separator">
          <div aria-labelledby="list-view-menu-stories" role="group">
            <div id="list-view-menu-stories" role="heading">
              Stories
            </div>
            <button aria-checked="false" data-rf-online-only data-rf-view="stories:collapse" hx-post="/htmx/list-view" hx-swap="none" hx-vals="{&quot;field&quot;: &quot;stories&quot;, &quot;value&quot;: &quot;collapse&quot;}" role="menuitemradio" type="button">
              Fold into one row
              <span aria-hidden="true" data-indicator>
                <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 6 9 17l-5-5">
                  </path>
                </svg>
              </span>
            </button>
            <button aria-checked="false" data-rf-online-only data-rf-view="stories:off" hx-post="/htmx/list-view" hx-swap="none" hx-vals="{&quot;field&quot;: &quot;stories&quot;, &quot;value&quot;: &quot;off&quot;}" role="menuitemradio" type="button">
              Off
              <span aria-hidden="true" data-indicator>
                <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 6 9 17l-5-5">
                  </path>
                </svg>
              </span>
            </button>
            <button aria-checked="false" data-rf-online-only data-rf-view="stories:collapse_suppress" hx-post="/htmx/list-view" hx-swap="none" hx-vals="{&quot;field&quot;: &quot;stories&quot;, &quot;value&quot;: &quot;collapse_suppress&quot;}" role="menuitemradio" type="button">
              Fold, and don't show a story I've read again
              <span aria-hidden="true" data-indicator>
                <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 6 9 17l-5-5">
                  </path>
                </svg>
              </span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <button aria-label="Mark all as read" class="btn" data-action="mark-all-read" data-size="icon-xs" data-variant="ghost" title="Mark all as read" type="button">
      <svg aria-hidden="true" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 6 7 17l-5-5">
        </path>
        <path d="m22 10-7.5 7.5L13 16">
        </path>
      </svg>
    </button>
  </div>
  <div class="flex gap-2 items-center pb-2.5 px-4">
    <svg class="h-3.5 shrink-0 text-muted-foreground w-3.5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
      <path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
      </path>
    </svg>
    <form class="flex flex-1 gap-2 items-center min-w-0" hx-disabled-elt="find button, find input" hx-indicator="#save-url-spinner" hx-post="/htmx/articles/save-url" hx-swap="innerHTML" hx-target="#article-list" id="save-url-form">
      <input aria-label="Article URL to save" class="flex-1 h-7 input min-w-0 text-sm" name="url" placeholder="Paste an article URL to save…" required type="url">
      <button class="btn shrink-0" data-size="xs" type="submit">
        Save
      </button>
      <svg class="animate-spin h-4 htmx-indicator shrink-0 text-muted-foreground w-4" fill="none" id="save-url-spinner" viewbox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
        </circle>
        <path class="opacity-75" d="M4 12a8 8 0 018-8v4l3-3-3-3v4a8 8 0 00-8 8h4z" fill="currentColor">
        </path>
      </svg>
    </form>
  </div>
</div>
