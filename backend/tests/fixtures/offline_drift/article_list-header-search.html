<div class="bg-blue-50 border-b border-blue-100 flex flex-wrap gap-x-2 gap-y-1.5 items-center leading-6 px-4 py-2.5 sticky text-sm top-0 z-10" data-list-header data-search-header data-search-query="R&amp;D &quot;x&quot;">
  <button class="bg-transparent border-0 cursor-pointer hover:text-blue-600 p-0.5 shrink-0 text-blue-400" data-action="open-search-again" title="New search">
    <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
      <path d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
      </path>
    </svg>
  </button>
  <span class="shrink-0 text-gray-500 whitespace-nowrap">
    2 results for
  </span>
  <strong class="min-w-0 text-gray-800 truncate" title="R&amp;D &quot;x&quot;">
    R&amp;D "x"
  </strong>
  <span class="flex gap-2 items-center shrink-0" data-save-search-area>
    <span aria-hidden="true" class="text-gray-400">
      ·
    </span>
    <button class="bg-transparent border-0 cursor-pointer hover:underline p-0 shrink-0 text-blue-600 text-sm whitespace-nowrap" data-action="open-save-search-inline" title="Keep this search in the sidebar">
      Save
    </button>
  </span>
  <button class="bg-transparent border-0 cursor-pointer hover:text-gray-600 ml-auto p-0.5 text-gray-400" data-action="refresh-articles" title="Clear search">
    <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
      <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
      </path>
    </svg>
  </button>
  <div class="basis-full hidden" data-save-search-form>
    <div class="flex gap-2 items-center">
      <input aria-label="Saved search name" class="bg-white border border-blue-200 dark:bg-gray-800 dark:border-blue-900 dark:text-gray-200 flex-1 focus:border-blue-400 focus:outline-hidden h-6 min-w-0 placeholder-gray-400 px-2 rounded-sm text-gray-800 text-sm" id="header-save-name" maxlength="100" placeholder="Name this search" type="text">
      <button class="bg-blue-600 border-0 cursor-pointer h-6 hover:bg-blue-700 leading-none px-3 rounded-sm shrink-0 text-sm text-white" data-action="save-search-inline">
        Save
      </button>
      <button class="bg-transparent border-0 cursor-pointer hover:text-gray-700 p-0 shrink-0 text-gray-500 text-sm" data-action="close-save-search-inline">
        Cancel
      </button>
    </div>
  </div>
  <p class="basis-full empty:hidden text-red-600 text-xs" id="header-save-error" role="alert">
  </p>
</div>
