<div class="bg-blue-50 border-b border-blue-100 flex flex-wrap gap-x-2 gap-y-1.5 items-center leading-6 px-4 py-2.5 sticky text-sm top-0 z-10" data-list-header data-search-header data-search-query="R&amp;D &quot;x&quot;">
  <button class="bg-transparent border-0 cursor-pointer hover:text-blue-600 p-0.5 shrink-0 text-blue-400" data-action="open-search-again" title="New search">
    <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
      <path d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">

  </span>
  <span class="flex gap-1 items-center ml-auto shrink-0">
    <div class="dropdown-menu" id="list-view-menu">
      <button aria-controls="list-view-menu-menu" aria-expanded="false" aria-haspopup="menu" class="btn" data-size="xs" data-variant="ghost" id="list-view-menu-trigger" title="View options" type="button">

          <path d="M8 12H3">
          </path>
        </svg>
        View

              Compact

                <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 6 9 17l-5-5">
                  </path>
                </svg>
              </span>
            </button>
            <button aria-checked="false" data-rf-online-only data-rf-view="density:comfortable" hx-post="/htmx/list-view" hx-swap="none" hx-vals="{&quot;field&quot;: &quot;density&quot;, &quot;value&quot;: &quot;comfortable&quot;}" role="menuitemradio" type="button">
              Comfortable
              <span aria-hidden="true" data-indicator>
                <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">

                  <path d="M20 6 9 17l-5-5">
                  </path>
                </svg>
              </span>
            </button>
          </div>
          <hr role="separator">
          <div aria-labelledby="list-view-menu-unread" role="group">

              Show
            </div>
            <button aria-checked="false" data-rf-online-only data-rf-view="unread:unread_only" hx-post="/htmx/list-view" hx-swap="none" hx-vals="{&quot;field&quot;: &quot;unread&quot;, &quot;value&quot;: &quot;unread_only&quot;}" role="menuitemradio" type="button">
              Unread only

              All
              <span aria-hidden="true" data-indicator>
                <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 6 9 17l-5-5">
                  </path>
                </svg>

            <button aria-checked="false" data-rf-online-only data-rf-view="unread:adaptive" hx-post="/htmx/list-view" hx-swap="none" hx-vals="{&quot;field&quot;: &quot;unread&quot;, &quot;value&quot;: &quot;adaptive&quot;}" role="menuitemradio" type="button">

                  <path d="M20 6 9 17l-5-5">
                  </path>
                </svg>
              </span>
            </button>
          </div>
          <hr role="separator">
          <div aria-labelledby="list-view-menu-stories" role="group">
            <div id="list-view-menu-stories" role="heading">

            <button aria-checked="false" data-rf-online-only data-rf-view="stories:collapse" hx-post="/htmx/list-view" hx-swap="none" hx-vals="{&quot;field&quot;: &quot;stories&quot;, &quot;value&quot;: &quot;collapse&quot;}" role="menuitemradio" type="button">

                  <path d="M20 6 9 17l-5-5">
                  </path>
                </svg>
              </span>
            </button>
            <button aria-checked="false" data-rf-online-only data-rf-view="stories:collapse_suppress" hx-post="/htmx/list-view" hx-swap="none" hx-vals="{&quot;field&quot;: &quot;stories&quot;, &quot;value&quot;: &quot;collapse_suppress&quot;}" role="menuitemradio" type="button">

                <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 6 9 17l-5-5">
                  </path>
                </svg>
              </span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <button class="bg-transparent border-0 cursor-pointer hover:text-gray-600 p-0.5 text-gray-400" data-action="refresh-articles" title="Clear search">
      <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
        <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
        </path>

  </span>
  <div class="basis-full hidden" data-save-search-form>
    <div class="flex gap-2 items-center">
      <input aria-label="Saved search name" class="bg-white border border-blue-200 dark:bg-gray-800 dark:border-blue-900 dark:text-gray-200 flex-1 focus:border-blue-400 focus:outline-hidden h-6 min-w-0 placeholder-gray-400 px-2 rounded-sm text-gray-800 text-sm" id="header-save-name" maxlength="100" placeholder="Name this search" type="text">
      <button class="bg-blue-600 border-0 cursor-pointer h-6 hover:bg-blue-700 leading-none px-3 rounded-sm shrink-0 text-sm text-white" data-action="save-search-inline">
        Save
      </button>
      <button class="bg-transparent border-0 cursor-pointer hover:text-gray-700 p-0 shrink-0 text-gray-500 text-sm" data-action="close-save-search-inline">
        Cancel
      </button>
    </div>
  </div>
  <p class="basis-full empty:hidden text-red-600 text-xs" id="header-save-error" role="alert">
  </p>
</div>
