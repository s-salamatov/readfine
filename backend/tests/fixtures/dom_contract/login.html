    <style>
      @layer utilities{html.rf-hide body{visibility:hidden!important}}
      @layer utilities{:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--mobile-bar-h:2.75rem}}
      @layer utilities{body{padding-top:var(--sat);padding-bottom:var(--sab);padding-left:var(--sal);padding-right:var(--sar)}}
      @layer utilities{body.app-chrome{padding:0}}
      @layer utilities{body:not(.app-chrome) .min-h-screen{min-height:calc(100vh - var(--sat) - var(--sab))}}
      @layer utilities{.app-shell{height:100vh;height:100dvh;padding-top:var(--sat);padding-bottom:var(--sab);padding-left:var(--sal);padding-right:var(--sar)}}
      @layer utilities{.prose h1{font-size:1.3em!important}}
      @layer utilities{.prose h2{font-size:1.15em!important;margin-top:1.4em;margin-bottom:.5em}}
      @layer utilities{.prose h3{font-size:1.05em!important;margin-top:1.2em;margin-bottom:.4em}}
      @layer utilities{.prose h4{font-size:1.0em!important;margin-top:1.0em;margin-bottom:.4em}}
      @layer utilities{.article-row{transition:opacity 150ms ease}}
      @layer utilities{.article-list-end-spacer{height:100%}}
      @layer utilities{html.sidebar-unpinned #sidebar{width:3rem}}
      @layer utilities{#sidebar-rail{display:none}}
      @layer utilities{html:not([data-bucket="small"]).sidebar-unpinned #sidebar-full{display:none}}
      @layer utilities{html:not([data-bucket="small"]).sidebar-unpinned #sidebar-rail{display:flex}}
      @layer utilities{html[data-bucket="small"][data-sidebar-mode="collapsible"]:not(.mobile-sidebar-open) #sidebar-full{display:none}}
      @layer utilities{html[data-bucket="small"][data-sidebar-mode="collapsible"]:not(.mobile-sidebar-open) #sidebar-rail{display:flex}}
      @layer utilities{#sidebar{overflow-x:hidden}}
      @layer utilities{#sidebar-full{width:15rem}}
      @layer utilities{#sidebar-rail{width:3rem}}
      @layer utilities{html[data-layout="2"] #article-detail{display:none}}
      @layer utilities{@media (hover:none) and (pointer:coarse){html[data-layout="2"] #article-list{flex:1!important;width:auto!important}}}
      @layer utilities{@media (hover:none) and (pointer:coarse){html[data-layout="2"] #article-list-resizer{display:none}}}
      @layer utilities{.article-row .expand-indicator{visibility:hidden}}
      @layer utilities{.article-row.inline-expanded .expand-indicator{visibility:visible}}
      @layer utilities{.article-row.inline-expanded{box-shadow:inset 0 6px 8px -6px var(--rf-inset-shadow)}}
      @layer utilities{.article-row.inline-expanded [data-article-title]{font-weight:700!important}}
      @layer utilities{.article-row [data-article-title]{color:inherit;text-decoration:none}}
      @layer utilities{.article-row.inline-expanded [data-article-title]{cursor:pointer}}
      @layer utilities{.ai-loading-indicator{display:none}}
      @layer utilities{.ai-loading-indicator.htmx-request{display:flex}}
      @layer utilities{#mobile-detail-back-bar{display:contents}}
      @layer utilities{#mobile-detail-back-btn,[data-article-toolbar] .article-toolbar-phone{display:none}}
      @layer utilities{#inline-article-detail-content [data-article-toolbar]{position:relative}}
      @layer utilities{.article-detail-title-row [data-detail-title]{font-family:var(--rf-serif)}}
      @layer utilities{[data-header-star] svg[fill="currentColor"]{color:var(--rf-star)}}
      @layer utilities{[data-rf-progress]{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--primary);transform-origin:left center;transform:scaleX(var(--rf-progress,0));pointer-events:none}}
      @layer utilities{.ai-summary-zone:has(.ai-text,.htmx-request,[hx-trigger^="every"]) [data-rf-slot="ai-summary-action"]{display:none}}
      @layer utilities{.ai-panel:has(>.ai-panel-ask) [role="tablist"]{margin-right:5rem}}
      @layer utilities{#inline-article-detail-content .article-detail-title-row{display:none}}
      @layer utilities{#inline-article-detail-content .article-detail-meta{padding-left:0!important}}
      @layer utilities{#inline-article-detail-content article{padding-top:.75rem}}
      @layer utilities{html[data-label-display="dots"] #inline-article-detail-content .detail-labels-area{display:none}}
      @layer utilities{#inline-article-detail-content .detail-meta-feed,#inline-article-detail-content .detail-meta-author-sep,#inline-article-detail-content .detail-meta-date-sep,#inline-article-detail-content .detail-meta-date{display:none}}
      @layer utilities{#inline-article-detail-content .flex:not(:has(.detail-meta-author)) .detail-meta-readtime-sep{display:none}}
      @layer utilities{html[data-font-size="sm"] .reading-area .prose,html[data-font-size="sm"] .reading-area .ai-text{font-size:.875rem}}
      @layer utilities{html[data-font-size="lg"] .reading-area .prose,html[data-font-size="lg"] .reading-area .ai-text{font-size:1.125rem}}
      @layer utilities{html[data-font-family="serif"] .reading-area .prose,html[data-font-family="serif"] .reading-area .ai-text{font-family:var(--rf-serif)}}
      @layer utilities{.prose p,.prose li,.prose blockquote{line-height:1.6}}
      @layer utilities{.prose p{margin-top:1em;margin-bottom:1em}}
      @layer utilities{.prose img{margin-top:1em;margin-bottom:1em}}
      @layer utilities{.prose a:has(>img){display:inline-block}}
      @layer utilities{html[data-bucket="small"]{font-size:106.25%}}
      @layer utilities{html[data-bucket="small"] #article-list [data-article-title]{font-size:.9375rem}}
